services:
  - type: web
    name: sipga-backend
    runtime: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      # ─── BASE DE DATOS ───────────────────────────────────────────────────────
      # IMPORTANTE: usar UNA sola fuente. El .env local apunta a Neon;
      # aquí se sobreescribe con la misma URL para que Render y local usen la misma BD.
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_9uCAL1SIrsHG@ep-mute-dust-apqfhvyf-pooler.c-7.us-east-1.aws.neon.tech/sipga?sslmode=require"

      # ─── JWT ─────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # ─── CORS ────────────────────────────────────────────────────────────────
      # Reemplaza "tu-frontend.onrender.com" con el dominio real del frontend.
      # Separar múltiples orígenes con coma: "https://a.com,https://b.com"
      # En desarrollo local no se necesita este valor (ya está en config.py).
      - key: ALLOWED_ORIGINS
        value: "https://tu-frontend.onrender.com,http://localhost:5500,http://127.0.0.1:5500"