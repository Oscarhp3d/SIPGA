<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPRA - Conexión Backend</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-blue-600 mb-6">SIPRA: Panel de Verificación</h1>
        
        <div id="status-card" class="p-4 mb-6 rounded-lg bg-yellow-100 text-yellow-700">
            Verificando conexión con la API...
        </div>

        <div class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-700">Crear Usuario de Prueba (Ley 1581)</h2>
            <input id="nombre" type="text" placeholder="Nombre Completo" class="w-full p-2 border rounded">
            <input id="correo" type="email" placeholder="Correo Institucional" class="w-full p-2 border rounded">
            <select id="rol" class="w-full p-2 border rounded">
                <option value="estudiante">Estudiante</option>
                <option value="tutor">Tutor Académico</option>
                <option value="supervisor">Supervisor Empresarial</option>
            </select>
            <input id="password" type="password" placeholder="Contraseña Segura" class="w-full p-2 border rounded">
            <button onclick="crearUsuario()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                Registrar en PostgreSQL
            </button>
        </div>

        <div id="resultado" class="mt-6 p-4 bg-gray-50 rounded border hidden"></div>
    </div>
    <div class="mt-10 space-y-4 border-t pt-6">
    <h2 class="text-lg font-semibold text-gray-700">Subir Evidencia (Fase de Excelencia)</h2>
    <input id="seguimiento_id" type="number" placeholder="ID del Seguimiento" class="w-full p-2 border rounded">
    <input id="archivo" type="file" class="w-full p-2 border rounded">
    <button onclick="subirEvidencia()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
        Enviar Evidencia al Servidor
    </button>
    </div>
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Verificar si el backend está vivo
        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/`);
                const data = await response.json();
                const card = document.getElementById('status-card');
                card.className = "p-4 mb-6 rounded-lg bg-green-100 text-green-700";
                card.innerText = "✅ Backend Conectado: " + data.status;
            } catch (error) {
                const card = document.getElementById('status-card');
                card.className = "p-4 mb-6 rounded-lg bg-red-100 text-red-700";
                card.innerText = "❌ Error: Backend no detectado en " + API_URL;
            }
        }

        async function crearUsuario() {
            const payload = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                rol: document.getElementById('rol').value,
                password: document.getElementById('password').value
            };

            const resBox = document.getElementById('resultado');
            
            try {
                const response = await fetch(`${API_URL}/usuarios/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                resBox.classList.remove('hidden');
                resBox.innerHTML = `<pre class="text-sm">${JSON.stringify(result, null, 2)}</pre>`;
                alert("Usuario creado con éxito en la base de datos");
            } catch (error) {
                alert("Error al conectar con la API");
            }
        }

        checkStatus();
    </script>
</body>
</html>
